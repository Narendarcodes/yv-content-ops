          type: string
          minLength: 1
          maxLength: 200
          example: 'Video production agreement'
        terms:
          type: string
          maxLength: 20000
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
