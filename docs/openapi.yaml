    PostMessageRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        parentId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: Parent message id to reply in a thread
        attachments:
          type: array
          items:
            type: string
          maxItems: 20
    Channel:
      type: object
      properties:
        _id:
          type: string
        projectId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [channel, dm]
        members:
          type: array
          items:
            type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChatMessage:
      type: object
      properties:
        _id:
          type: string
        channelId:
          type: string
        projectId:
          type: string
        author:
          type: string
        parentId:
          type: string
          nullable: true
        body:
          type: string
        attachments:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Contracts ----------
    ContractRequest:
      type: object
      additionalProperties: false
      properties:
        projectId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
