components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token returned by /auth/login or /auth/refresh (15 min expiry)

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId of the organization
    MemberUserId:
      name: memberUserId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId of the member user
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId of the project
    InputId:
      name: inputId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId of the input
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId of the revision request
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId of the notification
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId of the user
    ListStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
      description: Filter projects by status
    ListAssignee:
      name: assignee
      in: query
      required: false
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: Filter projects by assignee user id
    ListSearch:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Free-text search across project title/description
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Maximum number of items to return
    Skip:
      name: skip
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of items to skip (offset pagination)
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId of the task
    TaskStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [todo, in_progress, in_review, done]
      description: Filter tasks by kanban column
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId of the chat channel
    ContractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId of the contract
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId of the invoice
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: Sort field/direction

  schemas:
    # ---------- Auth ----------
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthResponse:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: JWT access token (15 min expiry)
        refreshToken:
          type: string
          description: Opaque refresh token (7 day expiry, rotates on use)

    # ---------- Entities ----------
    User:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: Password hash is never serialized
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        owner:
          type: string
          description: User id of the owner
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Membership:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        role:
          type: string
          description: Role name (e.g. admin, editor, viewer)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Project:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        title:
          type: string
          maxLength: 300
        description:
          type: string
          nullable: true
          maxLength: 5000
        type:
          type: string
          description: Project type
        status:
          type: string
          enum: [draft, in_review, approved, scheduled, published, archived]
        assignee:
          type: string
          nullable: true
          description: User id of the assignee
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectVersion:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        versionNumber:
          type: integer
        fileRef:
          type: string
          nullable: true
          description: Reference to the stored file
        changeSummary:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        status:
          type: string
          description: Approval status (e.g. pending, approved)
        createdBy:
          type: string
          description: User id
        createdAt:
          type: string
          format: date-time
    Input:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
          maxLength: 300
        description:
          type: string
          nullable: true
        owner:
          type: string
          nullable: true
          description: User id
        source:
          type: string
          nullable: true
        state:
          type: string
          enum: [requested, received, missing, blocked]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Comment:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        versionId:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
          description: Parent comment id for threaded replies
        authorId:
          type: string
        body:
          type: string
          maxLength: 10000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RevisionRequest:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        sourceVersionId:
          type: string
          nullable: true
        requestedBy:
          type: string
          description: User id
        reason:
          type: string
          maxLength: 5000
        status:
          type: string
          enum: [in_progress, submitted, resolved]
        resolvedVersionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Publication:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        platform:
          type: string
          maxLength: 100
        postUrl:
          type: string
          format: uri
          nullable: true
        postId:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    PerformanceMetric:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        publicationId:
          type: string
          nullable: true
        metric:
          type: string
          maxLength: 100
        value:
          type: number
        unit:
          type: string
          nullable: true
        recordedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ActivityEvent:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        actorId:
          type: string
          description: User id of the actor
        type:
          type: string
          description: Event type (e.g. project.created, version.approved)
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
          title:
            type: string
        body:
          type: string
        read:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time

    # ---------- Requests ----------
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
          description: Optional URL-safe slug (generated from name if omitted)
    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          description: Email of the user to add
        role:
          type: string
          description: Role name to assign
    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          description: New role name
    CreateProjectRequest:
      type: object
      required: [organizationId, title]
      properties:
        organizationId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 5000
          nullable: true
        type:
          type: string
          description: Project type
    TransitionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Target status (must be a legal transition from the current state)
    AssignRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
    ApproveRequest:
      type: object
      required: [versionId]
      properties:
        versionId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
    ScheduleRequest:
      type: object
      required: [scheduledAt]
      properties:
        scheduledAt:
          type: string
          format: date-time
    CreateInputRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 5000
          nullable: true
        owner:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          nullable: true
        source:
          type: string
          maxLength: 500
          nullable: true
    UpdateInputRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [requested, received, missing, blocked]
        assetRef:
          type: string
          maxLength: 500
          nullable: true
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        versionId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          nullable: true
        parentId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          nullable: true
        body:
          type: string
          minLength: 1
          maxLength: 10000
    CreateRevisionRequest:
      type: object
      required: [reason]
      properties:
        sourceVersionId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          nullable: true
        reason:
          type: string
          minLength: 1
          maxLength: 5000
    UpdateRevisionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, submitted, resolved]
        resolvedVersionId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          nullable: true
    CreatePublicationRequest:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
          minLength: 1
          maxLength: 100
        postUrl:
          type: string
          format: uri
          nullable: true
        postId:
          type: string
          maxLength: 300
          nullable: true
    CreateMetricRequest:
      type: object
      required: [metric, value]
      properties:
        publicationId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          nullable: true
        metric:
          type: string
          minLength: 1
          maxLength: 100
        value:
          type: number
        unit:
          type: string
          maxLength: 50
          nullable: true

    # ---------- Common ----------
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        db:
          type: string
          example: connected
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              examples: [not_found, unauthorized, forbidden, conflict, internal_error]
            message:
              type: string
    ValidationError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              const: validation_error
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    # ---------- Tasks ----------
    CreateTaskRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: 'Export 4K master'
        description:
          type: string
          maxLength: 2000
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        assignee:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: User id responsible for the task
        dueDate:
          type: string
          format: date
    UpdateTaskRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        priority:
          type: string
          enum: [low, medium, high]
        assignee:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        dueDate:
          type: string
          format: date
    TaskStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [todo, in_progress, in_review, done]
          example: done
    Task:
      type: object
      properties:
        _id:
          type: string
          example: 507f1f77bcf86cd799439011
        projectId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [todo, in_progress, in_review, done]
        priority:
          type: string
          enum: [low, medium, high]
        assignee:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        createdBy:
          type: string
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Briefs ----------
    BriefRequest:
      type: object
      additionalProperties: false
      properties:
        goal:
          type: string
          maxLength: 5000
          example: 'Launch promo video for Q3 product drop'
        targetAudience:
          type: string
          maxLength: 2000
        videoType:
          type: string
          maxLength: 200
        references:
          type: array
          items:
            type: string
          maxItems: 100
        deliverables:
          type: array
          items:
            type: string
          maxItems: 100
        deadline:
          type: string
          format: date
        brandGuidelines:
          type: string
          maxLength: 5000
        specialInstructions:
          type: string
          maxLength: 5000
    Brief:
      type: object
      properties:
        _id:
          type: string
        projectId:
          type: string
        goal:
          type: string
          nullable: true
        targetAudience:
          type: string
          nullable: true
        videoType:
          type: string
          nullable: true
        references:
          type: array
          items:
            type: string
        deliverables:
          type: array
          items:
            type: string
        deadline:
          type: string
          format: date
          nullable: true
        brandGuidelines:
          type: string
          nullable: true
        specialInstructions:
          type: string
          nullable: true
        submittedBy:
          type: string
        exists:
          type: boolean
          description: false when no brief has been created yet
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Reviews ----------
    ReviewSummarizeRequest:
      type: object
      required: [versionId]
      additionalProperties: false
      properties:
        versionId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: Version whose unresolved comments are summarized
    ReviewLockRequest:
      type: object
      required: [versionId]
      additionalProperties: false
      properties:
        versionId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: Version whose unresolved comments get locked into scope
    ReviewSummary:
      type: object
      properties:
        projectId:
          type: string
        versionId:
          type: string
        totalComments:
          type: integer
        unresolvedComments:
          type: integer
        actionItems:
          type: array
          items:
            type: string
          description: Action-oriented items extracted from feedback
        sections:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              items:
                type: array
                items:
                  type: string
        generatedBy:
          type: string
          const: rule-based-summarizer
          description: Swap point for an AI/LLM summarizer later
    ScopeItem:
      type: object
      properties:
        commentId:
          type: string
        author:
          type: string
        body:
          type: string

    # ---------- Chat ----------
    CreateChannelRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: general
        type:
          type: string
          enum: [channel, dm]
          default: channel
        members:
          type: array
          items:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
