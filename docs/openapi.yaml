        sentTo:
          type: string
          description: Client name or email the contract is sent to
    SignContractRequest:
      type: object
      required: [signerName, signerEmail]
      additionalProperties: false
      properties:
        signerName:
          type: string
          minLength: 1
          maxLength: 200
        signerEmail:
          type: string
          format: email
    Contract:
      type: object
      properties:
        _id:
          type: string
        organizationId:
          type: string
        projectId:
          type: string
          nullable: true
        title:
          type: string
        terms:
          type: string
          nullable: true
        amount:
          type: number
          nullable: true
        currency:
          type: string
        status:
          type: string
          enum: [draft, sent, viewed, signed]
        sentTo:
          type: string
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        viewedAt:
          type: string
          format: date-time
          nullable: true
        signedAt:
          type: string
          format: date-time
          nullable: true
        signedBy:
          type: string
          nullable: true
        signerName:
          type: string
          nullable: true
        signerEmail:
          type: string
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Invoices ----------
    InvoiceRequest:
      type: object
      required: [number, amount]
      additionalProperties: false
      properties:
        projectId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        number:
          type: string
          minLength: 1
          maxLength: 100
          example: INV-2025-001
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: USD
        dueDate:
          type: string
          format: date
        note:
          type: string
          maxLength: 2000
    PaymentRequest:
      type: object
      additionalProperties: false
      properties:
        paymentMethod:
          type: string
          maxLength: 100
          example: bank_transfer
        paidAt:
          type: string
          format: date-time
    Invoice:
      type: object
      properties:
        _id:
          type: string
        organizationId:
          type: string
        projectId:
          type: string
          nullable: true
        number:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [draft, sent, paid, overdue, void]
        issuedAt:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        paymentMethod:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OutstandingSummary:
      type: object
      properties:
        totalOutstanding:
          type: number
        byCurrency:
          type: object
          additionalProperties:
            type: number
        invoiceCount:
          type: integer
        overdue:
          type: object
          properties:
            count:
              type: integer
            amount:
              type: number
